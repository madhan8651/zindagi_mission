<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mission Complete ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    height:100vh;

    overflow:hidden;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);

    position:relative;

}

/* Floating Rain */

.rain{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

}

/* Love Message */

#love{

    position:fixed;

    top:40px;

    left:50%;

    transform:translateX(-50%);

    font-size:42px;

    font-weight:bold;

    color:#ff2f7d;

    text-shadow:0 0 20px #fff;

    z-index:999;

}

/* Glass Card */

.container{

    width:600px;

    max-width:90%;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(15px);

    border-radius:25px;

    padding:35px;

    text-align:center;

    box-shadow:0 10px 40px rgba(0,0,0,.25);

    border:1px solid rgba(255,255,255,.25);

    z-index:10;

}

h1{

    color:white;

    font-size:40px;

    margin-bottom:20px;

}

#text{

    color:white;

    font-size:21px;

    line-height:36px;

    min-height:260px;

}

/* Heart Beat */

@keyframes heartbeat{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

#love{

animation:heartbeat 1s infinite;

}

/* Mobile */

@media(max-width:768px){

.container{

width:95%;

padding:25px;

}

#love{

font-size:28px;

}

h1{

font-size:30px;

}

#text{

font-size:18px;

line-height:30px;

}

}

    </style>

</head>

<body>

<div class="rain"></div>

<div id="love"></div>

<div class="container">

<h1>
🎉 Mission Complete ❤️
</h1>

<div id="text"></div>

</div>

<audio id="bgMusic" autoplay hidden>
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script src="final.js"></script>

</body>

</html>
