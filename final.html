<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Complete ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#1a1a40,#6a11cb);

overflow:hidden;

color:white;

text-align:center;

}

.card{

background:rgba(255,255,255,.1);

padding:50px;

border-radius:25px;

backdrop-filter:blur(15px);

max-width:700px;

width:90%;

}

h1{

font-size:45px;

margin-bottom:20px;

animation:pulse 1.5s infinite;

}

p{

font-size:22px;

line-height:40px;

}

button{

margin-top:40px;

padding:15px 40px;

border:none;

border-radius:40px;

background:#ff4d8d;

color:white;

font-size:18px;

cursor:pointer;

}

@keyframes pulse{

50%{

transform:scale(1.08);

}

}
.hearts span{

position:absolute;

bottom:-50px;

font-size:30px;

animation:float 10s linear infinite;

}

.hearts span:nth-child(1){left:10%;}
.hearts span:nth-child(2){left:30%;animation-duration:12s;}
.hearts span:nth-child(3){left:50%;animation-duration:9s;}
.hearts span:nth-child(4){left:70%;animation-duration:13s;}
.hearts span:nth-child(5){left:90%;animation-duration:11s;}

@keyframes float{

from{

transform:translateY(0);

opacity:1;

}

to{

transform:translateY(-120vh);

opacity:0;

}

}
</style>

</head>

<body>
    
<div class="hearts">
    <span>❤️</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💞</span>
</div>
<div class="card">

<h1>❤️ Mission Complete ❤️</h1>

<p id="text"></p>

<button onclick="location.href='index.html'">

Play Again 😊

</button>

</div>

<script src="final.js"></script>
<audio id="bgMusic" autoplay style="display:none;">
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script src="final.js"></script>

</body>
</body>
</html>
