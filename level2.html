<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 2 - Find the Hearts</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;
overflow:hidden;

background:linear-gradient(135deg,#ff9a9e,#fad0c4);

}

h1{

text-align:center;
margin-top:20px;
color:white;

}

#score{

position:absolute;
top:20px;
right:30px;

font-size:24px;
color:white;

}

.heart{

position:absolute;

font-size:55px;

cursor:pointer;

transition:.3s;

user-select:none;

}

.heart:hover{

transform:scale(1.2);

}

#popup{

position:absolute;

left:50%;

top:90px;

transform:translateX(-50%);

background:white;

padding:12px 20px;

border-radius:15px;

display:none;

font-size:18px;

}

#next{

display:none;

position:absolute;

left:50%;

bottom:40px;

transform:translateX(-50%);

padding:15px 35px;

border:none;

border-radius:40px;

background:#ff4d8d;

color:white;

font-size:18px;

cursor:pointer;

}

</style>

</head>

<body>

<h1>❤️ Find 10 Hearts ❤️</h1>

<div id="score">0 / 10</div>

<div id="popup"></div>

<button id="next">Continue 🎁</button>

<script src="level2.js"></script>

</body>
</html>
