<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 3 - Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:linear-gradient(135deg,#ff9a9e,#fad0c4);

overflow:hidden;

}

h1{

color:white;

margin-bottom:40px;

text-shadow:2px 2px 10px rgba(0,0,0,.2);

}

.boxes{

display:flex;

gap:40px;

flex-wrap:wrap;

justify-content:center;

}

.box{

width:120px;

height:120px;

background:white;

border-radius:20px;

display:flex;

justify-content:center;

align-items:center;

font-size:60px;

cursor:pointer;

transition:.3s;

box-shadow:0 10px 25px rgba(0,0,0,.2);

}

.box:hover{

transform:translateY(-10px) scale(1.08);

}

#result{

    display:none;

    width:700px;

    max-width:90%;

    margin-top:20px;

    text-align:center;

}

button{

margin-top:30px;

padding:15px 40px;

border:none;

border-radius:40px;

background:#ff4d8d;

color:white;

font-size:18px;

cursor:pointer;

display:none;

}

</style>

</head>

<body>

<h1>🎁 Choose One Surprise 🎁</h1>

<div class="boxes">

<div class="box">🎁</div>

<div class="box">🎁</div>

<div class="box">🎁</div>

</div>

<div id="result"></div>

<button id="nextBtn">
Final Message ❤️
</button>

<script src="level3.js"></script>
<audio id="bgMusic" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>
</body>
</html>
